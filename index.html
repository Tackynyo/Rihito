<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex, nofollow">
  <title>古文 助動詞マスター | 活用・意味 暗記アプリ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    
    <!-- アプリ共通ヘッダー（タップでホーム画面に戻る） -->
    <header class="app-header" id="app-header-nav" role="button" tabindex="0" title="ホーム画面に戻る" aria-label="ホーム画面に戻る">
      <div class="header-inner">
        <h1 class="app-title" id="app-main-title">古文 助動詞マスター</h1>
        <p class="app-subtitle">スマートフォンでサクサク覚える活用・意味暗記シート</p>
      </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-content">

      <!-- =================================================================
           画面①: ホーム画面（検索窓 ＋ 接続一覧 ＋ 暗記お助けTips）
           ================================================================= -->
      <section id="home-view" class="view active-view" aria-label="ホーム画面">
        <!-- 検索バー（助動詞と主な意味でヒット） -->
        <div class="search-box-wrapper">
          <input type="text" id="search-input" class="search-input" placeholder="助動詞・主な意味で検索 (例: 過去, る, 推量)..." autocomplete="off" aria-label="助動詞名や主な意味で検索">
          <button id="clear-search-btn" class="clear-search-btn" aria-label="検索クリア" hidden>&times;</button>
        </div>

        <!-- 検索結果一覧（検索キーワード入力時のみ表示） -->
        <div id="search-results-container" class="search-results-container" hidden>
          <div class="search-results-header">
            <span class="search-count-badge" id="search-count-badge">0件ヒット</span>
          </div>
          <div id="search-results-list" class="search-results-list" role="list">
            <!-- app.js から動的生成 -->
          </div>
        </div>

        <!-- 通常の接続一覧リスト（1〜5: 接続、6: 暗記お助けTips） -->
        <div id="connection-list" class="category-list" role="list">
          <!-- data.js から動的に生成 -->
        </div>
      </section>

      <!-- =================================================================
           画面②: 助動詞グループリスト画面（意味・用法は記載しない）
           ================================================================= -->
      <section id="group-view" class="view" aria-label="助動詞リスト" hidden>
        <nav class="sub-nav">
          <button id="back-to-home-btn" class="nav-btn" aria-label="接続一覧に戻る">
            <span class="icon">&larr;</span> 接続一覧
          </button>
        </nav>

        <div class="view-intro">
          <h2 id="group-category-title" class="section-title">未然形接続</h2>
          <p class="intro-text">学習する項目をタップしてください。</p>
        </div>

        <div id="group-list" class="group-items-list" role="list">
          <!-- data.js から動的に生成 (例:「る・らる」「す・さす・しむ・ず」など) -->
        </div>
      </section>

      <!-- =================================================================
           画面③・④・⑤: 学習画面（8行×2列 活用表 / 主な意味 / 前後スライド）
           ================================================================= -->
      <section id="study-view" class="view" aria-label="暗記学習" hidden>
        <!-- 上部ナビゲーションバー -->
        <nav class="study-top-nav">
          <button id="back-to-groups-btn" class="nav-btn" aria-label="戻る">
            <span class="icon">&larr;</span> <span id="back-btn-label">リスト</span>
          </button>
          <div class="study-step-badge" id="study-step-badge">
            1 / 4
          </div>
        </nav>

        <!-- 学習カード表示エリア（スワイプ/スライド対応） -->
        <div id="study-deck-container" class="study-deck-container">
          <!-- app.js から現在のステップ（活用表または主な意味）を動的レンダリング -->
        </div>

        <!-- 画面下部: スライド操作コントロールバー（右ボタン / 左ボタン） -->
        <footer class="study-bottom-dock">
          <button id="dock-prev-btn" class="dock-nav-btn prev-btn" aria-label="前の画面へ">
            <span class="dock-arrow">&larr;</span>
            <span class="dock-text">前へ</span>
          </button>
          
          <div class="dock-center-indicator" id="dock-center-indicator">
            <span class="indicator-label">左にスライドで次へ</span>
          </div>

          <button id="dock-next-btn" class="dock-nav-btn next-btn" aria-label="次の画面へ">
            <span class="dock-text">次へ</span>
            <span class="dock-arrow">&rarr;</span>
          </button>
        </footer>
      </section>

      <!-- =================================================================
           画面⑥: 暗記お助けTips一覧画面
           ================================================================= -->
      <section id="tips-list-view" class="view" aria-label="暗記お助けTips一覧" hidden>
        <nav class="sub-nav">
          <button id="back-from-tips-btn" class="nav-btn" aria-label="ホームに戻る">
            <span class="icon">&larr;</span> ホームに戻る
          </button>
        </nav>

        <div class="view-intro">
          <h2 class="section-title">💡 暗記お助けTips</h2>
          <p class="intro-text">語呂合わせで覚える助動詞の主な意味・用法一覧です。</p>
        </div>

        <div id="tips-items-list" class="tips-items-list" role="list">
          <!-- app.js から動的に生成 (「む・むず (未然形接続)」「べし (終止形接続)」など) -->
        </div>
      </section>

      <!-- =================================================================
           画面⑦: 暗記お助けTips詳細画面（語呂表示 ＋ 各文字タップでポップアップ）
           ================================================================= -->
      <section id="tip-detail-view" class="view" aria-label="語呂詳細" hidden>
        <nav class="sub-nav">
          <button id="back-from-tip-detail-btn" class="nav-btn" aria-label="Tips一覧に戻る">
            <span class="icon">&larr;</span> <span id="tip-back-btn-label">Tips一覧</span>
          </button>
        </nav>

        <div class="tip-detail-card">
          <div class="tip-detail-header">
            <span class="tip-badge">語呂合わせ</span>
            <h2 id="tip-detail-title" class="tip-target-title">
              <span class="tip-verb-name">む・むず</span>
              <span class="tip-conn-name">未然形接続</span>
            </h2>
            <p id="tip-detail-desc" class="tip-target-desc">文字をタップすると主な意味が表示されます</p>
          </div>

          <!-- 各文字インタラクティブボタン群 -->
          <div id="tip-chars-grid" class="tip-chars-grid">
            <!-- app.js から各文字タイルを動的に生成 -->
          </div>

          <!-- 下部アクション: 活用表に直接遷移 -->
          <div class="tip-actions-bar">
            <button id="btn-go-to-conjugation" class="btn btn-primary" style="width: 100%;">
              <span>📖 この助動詞の活用表を表示</span>
            </button>
          </div>
        </div>
      </section>

    </main>

    <!-- 文字タップ時のポップアップモーダル -->
    <div id="char-popup-modal" class="popup-modal-overlay" hidden aria-hidden="true">
      <div class="popup-modal-card" role="dialog" aria-modal="true" aria-labelledby="popup-meaning">
        <button id="popup-close-btn" class="popup-close-btn" aria-label="閉じる">&times;</button>
        <div class="popup-char-badge" id="popup-char">ス</div>
        <div class="popup-meta-label">対応する主な意味</div>
        <div class="popup-meaning" id="popup-meaning">推量</div>
        <div class="popup-note" id="popup-note">〜だろう</div>
        <button id="popup-ok-btn" class="btn btn-primary popup-ok-btn">OK</button>
      </div>
    </div>

    <!-- アプリ共通フッター -->
    <footer class="app-footer">
      <p>高校古文 助動詞暗記ツール &copy; Rihito</p>
    </footer>
  </div>

  <!-- スクリプト読み込み -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
